<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
    <span id="theme-label">Oscuro</span>
    <span class="switch"></span>
  </button>

  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div id="objective-section" class="panel-section" hidden>
          <span class="label">OBJETIVO</span>
          <div id="objective" class="objective"></div>
        </div>

        <div id="energy-section" class="panel-section" hidden>
          <span class="label">ENERGÍA <kbd>E</kbd></span>
          <div class="energy"><div id="energy-fill" class="energy-fill"></div></div>
        </div>

        <div id="status" class="status"></div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido: <span id="mute-state">on</span></li>
          </ul>
        </div>
      </aside>

      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>

        <div id="overlay" class="overlay">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>
            <div id="overlay-extra" class="overlay-extra" hidden></div>
            <div id="overlay-buttons" class="overlay-buttons"></div>
          </div>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">-</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
          <canvas id="queue-canvas" width="120" height="120" hidden></canvas>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/core.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/powerups.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/render.js"></script>
  <script src="js/records.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
